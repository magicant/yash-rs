version: 2
updates:

  - package-ecosystem: "cargo"
    directory: "/"
    versioning-strategy: "lockfile-only"
    schedule:
      interval: "daily"
    # Keep this in sync with registry.global-min-publish-age in
    # .cargo/config.toml
    cooldown:
      default-days: 3
    groups:
      non-breaking:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 3
